<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details — Priyanshu Sengupta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0c;
            --bg-soft: #111111;
            --text: #f4f4f4;
            --muted: #8a8a8a;
            --line: rgba(255, 255, 255, 0.12);
            --accent: #c8ff00;
            --font: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; height: auto; display: block; }
        ul { list-style: none; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px clamp(20px, 6vw, 80px);
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }

        .topbar .back {
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
        }

        .topbar .back:hover { color: var(--accent); }
        .topbar .brand { font-weight: 700; }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: clamp(40px, 8vw, 90px) clamp(20px, 6vw, 40px);
        }

        .detail-hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(24px, 4vw, 48px);
            margin-bottom: clamp(48px, 8vw, 80px);
        }

        .detail-hero img {
            border-radius: 18px;
            border: 1px solid var(--line);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        }

        .detail-meta .cat {
            display: inline-block;
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .detail-meta h1 {
            font-size: clamp(2.4rem, 8vw, 4.4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.05;
            margin-bottom: 18px;
        }

        .detail-meta .desc {
            color: var(--muted);
            font-size: clamp(1.05rem, 2vw, 1.25rem);
            margin-bottom: 28px;
        }

        .actions { display: flex; flex-wrap: wrap; gap: 14px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }

        .btn-live { background: var(--accent); color: #000; }
        .btn-live:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(200, 255, 0, 0.35); }
        .btn-ghost { border: 1px solid var(--line); color: var(--text); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        .section-block { margin-top: clamp(36px, 6vw, 56px); }

        .section-block h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
        }

        .section-block p { color: var(--muted); }

        .feature-list li {
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            display: flex;
            gap: 14px;
            color: var(--text);
        }

        .feature-list li::before { content: '→'; color: var(--accent); font-weight: 700; }

        .tech-chips { display: flex; flex-wrap: wrap; gap: 10px; }

        .chip {
            background: var(--bg-soft);
            border: 1px solid var(--line);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
        }

        .chip:hover { border-color: var(--accent); color: var(--accent); }

        .not-found { text-align: center; padding: 80px 20px; }
        .not-found h1 { font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 12px; }
        .not-found p { color: var(--muted); margin-bottom: 24px; }

        @media (min-width: 640px) {
            .detail-hero { grid-template-columns: 1.1fr 0.9fr; align-items: center; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="back">&#8592; Back</a>
        <a href="index.html" class="brand">Priyanshu Sengupta</a>
    </header>

    <div class="wrap" id="page">
        <!-- filled by JS -->
    </div>

    <script>
        // ------------------ Project data ------------------
        const PROJECTS = {
            textutils: {
                title: "TextUtils",
                tag: "Web App",
                image: "./slide-2.png",
                live: "https://priyanshu-352.github.io/textutils/",
                github: "https://github.com/priyanshu-352",
                description: "TextUtils is a handy text-analysis tool that lets you manipulate, format and inspect text instantly.",
                features: [
                    "Convert text to uppercase, lowercase or capitalize each word",
                    "Remove extra spaces and punctuation",
                    "Live character, word and reading-time counters",
                    "Copy the result to the clipboard in one click",
                    "Clean, responsive interface that works on any device"
                ],
                tech: ["HTML", "CSS", "JavaScript", "React", "Bootstrap"]
            },
            calculator: {
                title: "Online Calculator",
                tag: "Web App",
                image: "./slide-3.png",
                live: "https://github.com/priyanshu-352",
                github: "https://github.com/priyanshu-352",
                description: "A fast, keyboard-friendly online calculator with a modern UI, built to handle everyday arithmetic with confidence.",
                features: [
                    "Basic arithmetic: addition, subtraction, multiplication, division",
                    "Percentage and decimal support",
                    "Full keyboard navigation",
                    "Instant, error-free calculations",
                    "Responsive and touch-friendly layout"
                ],
                tech: ["HTML", "CSS", "JavaScript"]
            },
            "ml-projects": {
                title: "AI / ML Projects",
                tag: "Machine Learning",
                image: "./images/cancerpic1.png",
                live: "https://github.com/priyanshu-352",
                github: "https://github.com/priyanshu-352",
                description: "A collection of applied machine-learning mini-projects covering data preparation, model evaluation and real-world predictions.",
                features: [
                    "Data preprocessing and cleaning pipelines",
                    "Model evaluation with scikit-learn",
                    "Hands-on use of ML libraries",
                    "Clear, documented experiments",
                    "Educational and reusable notebooks"
                ],
                tech: ["Python", "Scikit-learn", "TensorFlow", "NumPy", "Pandas"]
            },
            "frontend-website": {
                title: "Frontend Website",
                tag: "Web Design",
                image: "./Screenshot (7).png",
                live: "https://priyanshu-352.github.io/frontend-project/",
                github: "https://github.com/priyanshu-352",
                description: "A polished, responsive front-end website built to demonstrate modern layout, animation and clean component design.",
                features: [
                    "Fully responsive across mobile, tablet and desktop",
                    "Smooth scroll animations and transitions",
                    "Semantic, accessible markup",
                    "Reusable, maintainable CSS",
                    "Modern, performant UI"
                ],
                tech: ["HTML", "CSS", "JavaScript", "Bootstrap"]
            },
            "web-apps": {
                title: "Web Applications",
                tag: "Full Stack",
                image: "./slide-1.png",
                live: "https://github.com/priyanshu-352",
                github: "https://github.com/priyanshu-352",
                description: "Full-stack web applications that tie together a polished front end, a backend API and persistent data — end to end.",
                features: [
                    "Front end built with modern JS frameworks",
                    "Backend APIs with Flask / Node",
                    "Data persistence and RESTful design",
                    "Deployed to cloud platforms",
                    "Real-world, full-stack workflows"
                ],
                tech: ["HTML", "CSS", "JavaScript", "React", "Node.js", "Python", "Flask"]
            }
        };

        // ------------------ Render ------------------
        const FALLBACK = {
            title: "Project",
            tag: "Project",
            image: "./slide-1.png",
            live: "https://github.com/priyanshu-352",
            github: "https://github.com/priyanshu-352",
            description: "A project from Priyanshu's portfolio.",
            features: ["Built with care and attention to detail"],
            tech: ["HTML", "CSS", "JavaScript"]
        };

        function esc(s) {
            return String(s).replace(/[&<>"]/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
            })[c]);
        }

        function render() {
            const id = new URLSearchParams(window.location.search).get('id');
            const p = PROJECTS[id] || null;
            const page = document.getElementById('page');

            if (!p) {
                page.innerHTML = `
                    <div class="not-found">
                        <h1>Project not found</h1>
                        <p>Sorry, we couldn't find that project. Try another one from the home page.</p>
                        <a href="index.html" class="btn btn-live">&#8592; Back to projects</a>
                    </div>`;
                document.title = "Not found — Priyanshu Sengupta";
                return;
            }

            page.innerHTML = `
                <section class="detail-hero">
                    <img src="${esc(p.image)}" alt="${esc(p.title)} screenshot">
                    <div class="detail-meta">
                        <span class="cat">${esc(p.tag)}</span>
                        <h1>${esc(p.title)}</h1>
                        <p class="desc">${esc(p.description)}</p>
                        <div class="actions">
                            <a class="btn btn-live" href="${esc(p.live)}" target="_blank" rel="noopener">View Live ↗</a>
                            <a class="btn btn-ghost" href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>
                        </div>
                    </div>
                </section>

                <section class="section-block">
                    <h2>Overview</h2>
                    <p>${esc(p.description)} Built as part of Priyanshu's portfolio to showcase practical, real-world work.</p>
                </section>

                <section class="section-block">
                    <h2>Key Features</h2>
                    <ul class="feature-list">
                        ${p.features.map(f => `<li>${esc(f)}</li>`).join('')}
                    </ul>
                </section>

                <section class="section-block">
                    <h2>Technologies</h2>
                    <div class="tech-chips">
                        ${p.tech.map(t => `<span class="chip">${esc(t)}</span>`).join('')}
                    </div>
                </section>`;

            document.title = `${p.title} — Priyanshu Sengupta`;
        }

        render();
    </script>
</body>
</html>
